<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href=".\shadow.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>阴影示例</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            padding: 20px;
            background-color: #f5f7fa;
            margin: 0;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 50px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            height: 100%; /* Make card square */
            aspect-ratio: 1 / 1; /* Ensure the element is a square */
            background-color: white;
            border-radius: 8px;
            position: relative;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
        }

        .title {
            margin: auto;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .card.special-border {
            border: 2px solid #3498db;
        }

        /* Tooltip Styles */
        .tooltip {
            visibility: hidden;
            opacity: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(44, 62, 80, 0.9);
            color: white;
            text-align: center;
            border-radius: 8px;
            z-index: 10;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .card:hover .tooltip {
            visibility: visible;
            opacity: 1;
        }

        .tooltip strong,
        .copy-btn {
            user-select: none;
        }

        .tooltip-code {
            background-color: #34495e;
            padding: 8px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: monospace;
            word-break: break-all;
            overflow-wrap: break-word;
            max-height: 60%;
            overflow-y: auto;
            width: 90%;
        }

        .copy-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .copy-btn:hover {
            background-color: #2980b9;
        }

        .copy-btn.copied {
            background-color: #2ecc71;
        }

        .close-btn {
            position: absolute;
            top: 5px;
            right: 10px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>

        { id: 'bshadow91', title: 'No.91 阴影', text: 'box-shadow: rgba(0, 0, 0, 0.05) 0px 0px 0px 1px, rgb(209, 213, 219) 0px 0px 0px 1px inset;', special: false },
        { id: 'bshadow92', title: 'No.92 阴影', text: 'box-shadow: rgba(0, 0, 0, 0.35) 0px -50px 36px -28px inset;', special: false },
        { id: 'bshadow93', title: 'No.93 阴影', text: 'box-shadow: rgba(9, 30, 66, 0.25) 0px 1px 1px, rgba(9, 30, 66, 0.13) 0px 0px 1px 1px;', special: false },
        { id: 'bshadow94', title: 'No.94 阴影', text: 'box-shadow: rgba(9, 30, 66, 0.25) 0px 4px 8px -2px, rgba(9, 30, 66, 0.08) 0px 0px 0px 1px;', special: false }
        // 可以继续添加更多卡片配置...
    ];

    // --- 批量生成卡片 ---
    cardsConfig.forEach(config => {
        // 生成card div
        const cardDiv = document.createElement('div');
        cardDiv.className = 'card';
        cardDiv.id = config.id;

        // 创建特殊边框
        if (config.special) {
            cardDiv.classList.add('special-border');
        }

        // 创建标题
        cardDiv.innerHTML += `
            <div class="title">${config.title}</div>
        `;


        // 创建关闭按钮（保留此元素，以防未来需要）
        const closeBtn = document.createElement('span');
        closeBtn.className = 'close-btn';
        closeBtn.textContent = '×';
        cardDiv.appendChild(closeBtn);

        // 生成CSS代码字符串
        let cssCodeString = `${config.text}`;
        /*let cssCodeString = `${config.id} { width: 100%; height: 100%; aspect-ratio: 1 / 1; background-color: white; border-radius: 8px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);`;
        if (config.special) {
            cssCodeString += " border: 2px solid #3498db;";
        }
        cssCodeString += " }";*/

        // 格式化用于显示的CSS代码
        let formattedCssCode = `${config.text}`;
        /*
        let formattedCssCode = `${config.id} {<br>&nbsp;&nbsp;width: 100%;<br>&nbsp;&nbsp;height: 100%;<br>&nbsp;&nbsp;aspect-ratio: 1 / 1;<br>&nbsp;&nbsp;background-color: white;<br>&nbsp;&nbsp;border-radius: 8px;<br>&nbsp;&nbsp;box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);`;
        if (config.special) {
            formattedCssCode += "<br>&nbsp;&nbsp;border: 2px solid #3498db;";
        }
        formattedCssCode += "<br>}";*/

        // 创建提示框HTML
        cardDiv.innerHTML += `
            <div class="tooltip">
                <strong>CSS 代码:</strong>
                <div class="tooltip-code">${formattedCssCode}</div>
                <button class="copy-btn" data-target="${cssCodeString}">复制代码</button>
            </div>
        `;

        console.log(cardDiv);

        container.appendChild(cardDiv);
    });

    // --- 为所有复制按钮添加事件监听器 ---
    // 使用事件委托，只需在父容器上绑定一次事件
    container.addEventListener('click', function(event) {
        if (event.target.classList.contains('copy-btn')) {
            const targetCode = event.target.getAttribute('data-target');
            navigator.clipboard.writeText(targetCode).then(() => {
                // 提供反馈
                const originalText = event.target.textContent;
                event.target.textContent = '已复制!';
                event.target.classList.add('copied');

                setTimeout(() => {
                    event.target.textContent = originalText;
                    event.target.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('无法复制文本: ', err);
                alert('复制失败，请手动选择文本。');
            });
        }
    });

    // --- 可选：为关闭按钮添加功能 ---
    // 同样使用事件委托
    container.addEventListener('click', function(event) {
        if (event.target.classList.contains('close-btn')) {
            event.target.closest('.card').remove(); // 直接移除卡片
        }
    });
</script>

</body>

</html>
